<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid-arch" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.5" fill="#0a0a0a" opacity="0.12" />
    </pattern>
    <style>
      .mono { font-family: ui-monospace, 'JetBrains Mono', 'Roboto Mono', Menlo, Consolas, monospace; }
      .display { font-family: system-ui, -apple-system, 'Space Grotesk', BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="520" fill="#faf8f5" />
  <rect width="1200" height="520" fill="url(#dot-grid-arch)" />

  <!-- Outer Frame -->
  <rect x="8" y="8" width="1184" height="504" fill="none" stroke="#0a0a0a" stroke-width="3" />

  <!-- Top Header Banner -->
  <g id="arch-header" transform="translate(44, 20)">
    <!-- Shadow -->
    <rect x="6" y="6" width="1112" height="54" fill="#0a0a0a" />
    <!-- Body -->
    <rect x="0" y="0" width="1112" height="54" fill="#ffe600" stroke="#0a0a0a" stroke-width="3.5" />
    <!-- Title -->
    <text x="24" y="34" class="display" font-weight="900" font-size="20" fill="#0a0a0a" letter-spacing="0.5">
      ARQUITECTURA DEL SISTEMA &amp; PIPELINE DE EVENTOS
    </text>
    <!-- Latency Badge -->
    <rect x="712" y="10" width="388" height="34" fill="#0a0a0a" />
    <text x="906" y="32" class="mono" font-weight="900" font-size="11.5" fill="#00ff66" text-anchor="middle" letter-spacing="0.5">
      TTFA: 120-180ms // LATENCIA ULTRABAJA LOCAL
    </text>
  </g>

  <!-- 5-Stage Flow Diagram -->
  <g id="pipeline-stages" transform="translate(44, 94)">

    <!-- ================= STAGE 1 ================= -->
    <g transform="translate(0, 0)">
      <rect x="5" y="5" width="200" height="266" fill="#0a0a0a" />
      <rect x="0" y="0" width="200" height="266" fill="#ffffff" stroke="#0a0a0a" stroke-width="3" />
      <!-- Header -->
      <rect x="0" y="0" width="200" height="42" fill="#00ff66" stroke="#0a0a0a" stroke-width="3" />
      <text x="100" y="26" class="mono" font-weight="900" font-size="11" fill="#0a0a0a" text-anchor="middle">
        [1] EVENTOS RUNTIME
      </text>

      <text x="12" y="62" class="mono" font-weight="800" font-size="10" fill="#666666">PI CLI HOOKS</text>

      <!-- Items -->
      <rect x="10" y="74" width="180" height="32" fill="#faf8f5" stroke="#0a0a0a" stroke-width="1.5" />
      <text x="16" y="94" class="mono" font-weight="800" font-size="9.5" fill="#0a0a0a">tool_execution_start</text>

      <rect x="10" y="112" width="180" height="32" fill="#faf8f5" stroke="#0a0a0a" stroke-width="1.5" />
      <text x="16" y="132" class="mono" font-weight="800" font-size="9.5" fill="#0a0a0a">tool_execution_end</text>

      <rect x="10" y="150" width="180" height="32" fill="#faf8f5" stroke="#0a0a0a" stroke-width="1.5" />
      <text x="16" y="170" class="mono" font-weight="800" font-size="9.5" fill="#0a0a0a">agent_end</text>

      <rect x="10" y="188" width="180" height="32" fill="#faf8f5" stroke="#0a0a0a" stroke-width="1.5" />
      <text x="16" y="208" class="mono" font-weight="800" font-size="9.5" fill="#0a0a0a">user_prompt / input</text>

      <!-- Badge bottom -->
      <rect x="10" y="230" width="180" height="24" fill="#00ff66" stroke="#0a0a0a" stroke-width="1.5" />
      <text x="100" y="246" class="mono" font-weight="900" font-size="10" fill="#0a0a0a" text-anchor="middle">
        INTERCEPCIÓN SÍNCRONA
      </text>
    </g>

    <!-- Connector 1 -> 2 -->
    <g transform="translate(204, 120)">
      <polygon points="4,10 18,10 18,4 28,15 18,26 18,20 4,20" fill="#0a0a0a" />
    </g>

    <!-- ================= STAGE 2 ================= -->
    <g transform="translate(228, 0)">
      <rect x="5" y="5" width="200" height="266" fill="#0a0a0a" />
      <rect x="0" y="0" width="200" height="266" fill="#ffffff" stroke="#0a0a0a" stroke-width="3" />
      <!-- Header -->
      <rect x="0" y="0" width="200" height="42" fill="#ffe600" stroke="#0a0a0a" stroke-width="3" />
      <text x="100" y="26" class="mono" font-weight="900" font-size="11" fill="#0a0a0a" text-anchor="middle">
        [2] DECISIONGATE
      </text>

      <text x="12" y="62" class="mono" font-weight="800" font-size="10" fill="#666666">FILTRO EXCEPCIONES</text>

      <!-- Items -->
      <rect x="10" y="74" width="180" height="32" fill="#faf8f5" stroke="#0a0a0a" stroke-width="1.5" />
      <text x="16" y="94" class="mono" font-weight="800" font-size="9.5" fill="#0a0a0a">Filtro de bloques ```</text>

      <rect x="10" y="112" width="180" height="32" fill="#faf8f5" stroke="#0a0a0a" stroke-width="1.5" />
      <text x="16" y="132" class="mono" font-weight="800" font-size="9.5" fill="#0a0a0a">Permisos: ¿Autorizás?</text>

      <rect x="10" y="150" width="180" height="32" fill="#faf8f5" stroke="#0a0a0a" stroke-width="1.5" />
      <text x="16" y="170" class="mono" font-weight="800" font-size="9.5" fill="#0a0a0a">Opciones: 1/2 o A/B</text>

      <rect x="10" y="188" width="180" height="32" fill="#faf8f5" stroke="#0a0a0a" stroke-width="1.5" />
      <text x="16" y="208" class="mono" font-weight="800" font-size="9.5" fill="#0a0a0a">ask_user_* / question</text>

      <!-- Badge bottom -->
      <rect x="10" y="230" width="180" height="24" fill="#ffe600" stroke="#0a0a0a" stroke-width="1.5" />
      <text x="100" y="246" class="mono" font-weight="900" font-size="10" fill="#0a0a0a" text-anchor="middle">
        HABLA SOLO SI ACCIÓN
      </text>
    </g>

    <!-- Connector 2 -> 3 -->
    <g transform="translate(432, 120)">
      <polygon points="4,10 18,10 18,4 28,15 18,26 18,20 4,20" fill="#0a0a0a" />
    </g>

    <!-- ================= STAGE 3 ================= -->
    <g transform="translate(456, 0)">
      <rect x="5" y="5" width="200" height="266" fill="#0a0a0a" />
      <rect x="0" y="0" width="200" height="266" fill="#ffffff" stroke="#0a0a0a" stroke-width="3" />
      <!-- Header -->
      <rect x="0" y="0" width="200" height="42" fill="#00f0ff" stroke="#0a0a0a" stroke-width="3" />
      <text x="100" y="26" class="mono" font-weight="900" font-size="10.5" fill="#0a0a0a" text-anchor="middle">
        [3] TLDR &amp; TRANSLATE
      </text>

      <text x="12" y="62" class="mono" font-weight="800" font-size="10" fill="#666666">TRADUCCIÓN SÍNCRONA</text>

      <!-- Items -->
      <rect x="10" y="74" width="180" height="32" fill="#faf8f5" stroke="#0a0a0a" stroke-width="1.5" />
      <text x="16" y="94" class="mono" font-weight="800" font-size="9.5" fill="#0a0a0a">translateTaskLabel &lt;1ms</text>

      <rect x="10" y="112" width="180" height="32" fill="#faf8f5" stroke="#0a0a0a" stroke-width="1.5" />
      <text x="16" y="132" class="mono" font-weight="800" font-size="9.5" fill="#0a0a0a">Conjugación por rol</text>

      <rect x="10" y="150" width="180" height="32" fill="#faf8f5" stroke="#0a0a0a" stroke-width="1.5" />
      <text x="16" y="170" class="mono" font-weight="800" font-size="9.5" fill="#0a0a0a">Extractor YAML Outcome</text>

      <rect x="10" y="188" width="180" height="32" fill="#faf8f5" stroke="#0a0a0a" stroke-width="1.5" />
      <text x="16" y="208" class="mono" font-weight="800" font-size="9.5" fill="#0a0a0a">Barrera 100% Español</text>

      <!-- Badge bottom -->
      <rect x="10" y="230" width="180" height="24" fill="#00f0ff" stroke="#0a0a0a" stroke-width="1.5" />
      <text x="100" y="246" class="mono" font-weight="900" font-size="10" fill="#0a0a0a" text-anchor="middle">
        0 TOKENS MEMORIA
      </text>
    </g>

    <!-- Connector 3 -> 4 -->
    <g transform="translate(660, 120)">
      <polygon points="4,10 18,10 18,4 28,15 18,26 18,20 4,20" fill="#0a0a0a" />
    </g>

    <!-- ================= STAGE 4 ================= -->
    <g transform="translate(684, 0)">
      <rect x="5" y="5" width="200" height="266" fill="#0a0a0a" />
      <rect x="0" y="0" width="200" height="266" fill="#ffffff" stroke="#0a0a0a" stroke-width="3" />
      <!-- Header -->
      <rect x="0" y="0" width="200" height="42" fill="#a855f7" stroke="#0a0a0a" stroke-width="3" />
      <text x="100" y="26" class="mono" font-weight="900" font-size="10.5" fill="#ffffff" text-anchor="middle">
        [4] LOCK MANAGER
      </text>

      <text x="12" y="62" class="mono" font-weight="800" font-size="10" fill="#666666">EXCLUSIÓN POSIX</text>

      <!-- Items -->
      <rect x="10" y="74" width="180" height="32" fill="#faf8f5" stroke="#0a0a0a" stroke-width="1.5" />
      <text x="16" y="94" class="mono" font-weight="800" font-size="9.5" fill="#0a0a0a">/tmp/pi-voice-&lt;uid&gt;/</text>

      <rect x="10" y="112" width="180" height="32" fill="#faf8f5" stroke="#0a0a0a" stroke-width="1.5" />
      <text x="16" y="132" class="mono" font-weight="800" font-size="9.5" fill="#0a0a0a">Cola FIFO Tickets</text>

      <rect x="10" y="150" width="180" height="32" fill="#faf8f5" stroke="#0a0a0a" stroke-width="1.5" />
      <text x="16" y="170" class="mono" font-weight="800" font-size="9.5" fill="#0a0a0a">Modos: queue/focus</text>

      <rect x="10" y="188" width="180" height="32" fill="#faf8f5" stroke="#0a0a0a" stroke-width="1.5" />
      <text x="16" y="208" class="mono" font-weight="800" font-size="9.5" fill="#0a0a0a">PID Stale Recovery</text>

      <!-- Badge bottom -->
      <rect x="10" y="230" width="180" height="24" fill="#a855f7" stroke="#0a0a0a" stroke-width="1.5" />
      <text x="100" y="246" class="mono" font-weight="900" font-size="10" fill="#ffffff" text-anchor="middle">
        ANTI-COLISIÓN MULTI
      </text>
    </g>

    <!-- Connector 4 -> 5 -->
    <g transform="translate(888, 120)">
      <polygon points="4,10 18,10 18,4 28,15 18,26 18,20 4,20" fill="#0a0a0a" />
    </g>

    <!-- ================= STAGE 5 ================= -->
    <g transform="translate(912, 0)">
      <rect x="5" y="5" width="200" height="266" fill="#0a0a0a" />
      <rect x="0" y="0" width="200" height="266" fill="#ffffff" stroke="#0a0a0a" stroke-width="3" />
      <!-- Header -->
      <rect x="0" y="0" width="200" height="42" fill="#ff0055" stroke="#0a0a0a" stroke-width="3" />
      <text x="100" y="26" class="mono" font-weight="900" font-size="10.5" fill="#ffffff" text-anchor="middle">
        [5] KOKORO &amp; AUDIO
      </text>

      <text x="12" y="62" class="mono" font-weight="800" font-size="10" fill="#666666">SÍNTESIS &amp; REPROD</text>

      <!-- Items -->
      <rect x="10" y="74" width="180" height="32" fill="#faf8f5" stroke="#0a0a0a" stroke-width="1.5" />
      <text x="16" y="94" class="mono" font-weight="800" font-size="9.5" fill="#0a0a0a">Kokoro ONNX :8880</text>

      <rect x="10" y="112" width="180" height="32" fill="#faf8f5" stroke="#0a0a0a" stroke-width="1.5" />
      <text x="16" y="132" class="mono" font-weight="800" font-size="9.5" fill="#0a0a0a">24kHz PCM WAV Buffer</text>

      <rect x="10" y="150" width="180" height="32" fill="#faf8f5" stroke="#0a0a0a" stroke-width="1.5" />
      <text x="16" y="170" class="mono" font-weight="800" font-size="9.5" fill="#0a0a0a">pw-play / aplay / afplay</text>

      <rect x="10" y="188" width="180" height="32" fill="#faf8f5" stroke="#0a0a0a" stroke-width="1.5" />
      <text x="16" y="208" class="mono" font-weight="800" font-size="9.5" fill="#0a0a0a">Corte inmediato al tipear</text>

      <!-- Badge bottom -->
      <rect x="10" y="230" width="180" height="24" fill="#ff0055" stroke="#0a0a0a" stroke-width="1.5" />
      <text x="100" y="246" class="mono" font-weight="900" font-size="10" fill="#ffffff" text-anchor="middle">
        0 TOKENS LOCAL
      </text>
    </g>
  </g>

  <!-- Bottom Technical Highlight Cards (3 items) -->
  <g id="arch-highlights" transform="translate(44, 380)">

    <!-- Highlight 1 -->
    <g transform="translate(0, 0)">
      <rect x="4" y="4" width="354" height="106" fill="#0a0a0a" />
      <rect x="0" y="0" width="354" height="106" fill="#ffffff" stroke="#0a0a0a" stroke-width="3" />
      <rect x="0" y="0" width="354" height="28" fill="#00ff66" stroke="#0a0a0a" stroke-width="2" />
      <text x="12" y="19" class="mono" font-weight="900" font-size="11" fill="#0a0a0a">
        01 // ZERO TOKENS LOCAL ONNX
      </text>
      <text x="12" y="48" class="mono" font-weight="800" font-size="11" fill="#0a0a0a">
        Generación de voz con matrices neuronales
      </text>
      <text x="12" y="66" class="mono" font-weight="700" font-size="10.5" fill="#222222">
        .npy en CPU/GPU local sin costo de API
      </text>
      <text x="12" y="86" class="mono" font-weight="700" font-size="10.5" fill="#666666">
        ni dependencia de conexión a internet.
      </text>
    </g>

    <!-- Highlight 2 -->
    <g transform="translate(378, 0)">
      <rect x="4" y="4" width="354" height="106" fill="#0a0a0a" />
      <rect x="0" y="0" width="354" height="106" fill="#ffffff" stroke="#0a0a0a" stroke-width="3" />
      <rect x="0" y="0" width="354" height="28" fill="#ffe600" stroke="#0a0a0a" stroke-width="2" />
      <text x="12" y="19" class="mono" font-weight="900" font-size="11" fill="#0a0a0a">
        02 // LATENCIA ULTRABAJA (TTFA)
      </text>
      <text x="12" y="48" class="mono" font-weight="800" font-size="11" fill="#0a0a0a">
        120ms - 180ms TTFA en GPU local.
      </text>
      <text x="12" y="66" class="mono" font-weight="700" font-size="10.5" fill="#222222">
        Detección sintáctica de permisos en &lt;1ms
      </text>
      <text x="12" y="86" class="mono" font-weight="700" font-size="10.5" fill="#666666">
        con regex precompiladas en memoria.
      </text>
    </g>

    <!-- Highlight 3 -->
    <g transform="translate(756, 0)">
      <rect x="4" y="4" width="356" height="106" fill="#0a0a0a" />
      <rect x="0" y="0" width="356" height="106" fill="#ffffff" stroke="#0a0a0a" stroke-width="3" />
      <rect x="0" y="0" width="356" height="28" fill="#00f0ff" stroke="#0a0a0a" stroke-width="2" />
      <text x="12" y="19" class="mono" font-weight="900" font-size="11" fill="#0a0a0a">
        03 // AISLAMIENTO MULTI-PROCESO
      </text>
      <text x="12" y="48" class="mono" font-weight="800" font-size="11" fill="#0a0a0a">
        Cerrojos atómicos con PID monitoring.
      </text>
      <text x="12" y="66" class="mono" font-weight="700" font-size="10.5" fill="#222222">
        Si una terminal finaliza o crashea,
      </text>
      <text x="12" y="86" class="mono" font-weight="700" font-size="10.5" fill="#666666">
        el lock se auto-recupera de inmediato.
      </text>
    </g>
  </g>
</svg>
