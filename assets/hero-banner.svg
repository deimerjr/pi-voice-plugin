  <!-- Technical Audio Spec Label -->
  <text x="600" y="466" class="mono" font-weight="800" font-size="11" fill="#0a0a0a" text-anchor="middle" letter-spacing="1">
    KOKORO TTS LOCAL ONNX // PCM 24000Hz WAV // LOW LATENCY TTFA ~140ms // ZERO CLOUD DEPENDENCY
