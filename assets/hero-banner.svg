    <rect x="888" y="4" width="14" height="61" fill="#00ff66" stroke="#0a0a0a" stroke-width="2" />
    <rect x="912" y="24" width="14" height="41" fill="#00f0ff" stroke="#0a0a0a" stroke-width="2" />
