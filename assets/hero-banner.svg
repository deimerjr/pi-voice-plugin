    <rect x="504" y="0" width="14" height="65" fill="#00ff66" stroke="#0a0a0a" stroke-width="2" />
    <rect x="528" y="10" width="14" height="55" fill="#00f0ff" stroke="#0a0a0a" stroke-width="2" />
