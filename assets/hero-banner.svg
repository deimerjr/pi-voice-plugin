    <rect x="288" y="12" width="14" height="53" fill="#00f0ff" stroke="#0a0a0a" stroke-width="2" />
    <rect x="312" y="28" width="14" height="37" fill="#a855f7" stroke="#0a0a0a" stroke-width="2" />
    <rect x="336" y="42" width="14" height="23" fill="#0a0a0a" />
    <rect x="360" y="8" width="14" height="57" fill="#ffe600" stroke="#0a0a0a" stroke-width="2" />
    <rect x="384" y="22" width="14" height="43" fill="#ff0055" stroke="#0a0a0a" stroke-width="2" />
    <rect x="408" y="14" width="14" height="51" fill="#00ff66" stroke="#0a0a0a" stroke-width="2" />
    <rect x="432" y="36" width="14" height="29" fill="#00f0ff" stroke="#0a0a0a" stroke-width="2" />
    <rect x="456" y="4" width="14" height="61" fill="#ffe600" stroke="#0a0a0a" stroke-width="2" />

